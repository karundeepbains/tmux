# ─── Basics ───────────────────────────────────────────────
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Vim‐style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ─── Catppuccin theme (TPM‐managed) ───────────────────────
set -g @catppuccin_flavour             'mocha'
set -g @catppuccin_window_status_style "rounded"

set -g @plugin 'catppuccin/tmux#v2.1.3'        # theme
set -g @plugin 'tmux-plugins/tpm'             # TPM core
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'jonmosco/kube-tmux'
set -g @plugin 'omerxx/tmux-floax'

set -g @catppuccin_kube_context_color   "#{@thm_red}"
set -g @catppuccin_kube_namespace_color "#{@thm_sky}"

# ─── Status bar setup ─────────────────────────────────────
set -g status-interval     5
set -g status-left-length  40
set -g status-right-length 200
set -g status-left         ""

# initial status-right
set -g status-right "#{E:@catppuccin_status_kube} "

# append everything else
set -agF status-right "#{E:@catppuccin_status_application} "
set -agF status-right "#{E:@catppuccin_status_cpu} "
# after your CPU line
set -ag  status-right "#{E:@catppuccin_status_session} "
set -ag  status-right "#{E:@catppuccin_status_uptime} "

# ─── TPM bootstrap (do not move) ──────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# ─── Copy‐mode & directory binds ──────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind c new-window        -c "#{pane_current_path}"
bind '"' split-window    -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

